# Coolify deploy target — Kashew CRM.
#
# IMPORTANT: this stack shares the `coolify` Docker network with other apps
# (Maximoney CRM, etc.). Compose adds each service name as a DNS alias on every
# network it joins, so generic names like `backend` would COLLIDE across stacks
# on the shared network and cross-talk. We therefore use app-unique service
# names (kbackend) for anything that joins `coolify`. `cache` stays on the
# per-app default network only, so it can keep its name.

services:
  kbackend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://cache:6379
      DISK_STORAGE_PATH: /var/crm/docs
      HOST: 0.0.0.0
      PORT: '4000'
    volumes:
      - docs:/var/crm/docs
    depends_on:
      - cache
    networks:
      - default
      - coolify
    command: ["/bin/sh", "-c", "node dist/db/migrate.js && node dist/server.js"]

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_FQDN_FRONTEND_8080: /
    expose:
      - "8080"
    depends_on:
      - kbackend
    networks:
      - default
      - coolify
    labels:
      - traefik.docker.network=coolify
      # Router/service name is auto-generated by Coolify as
      # http-0-<app-uuid>-frontend. Pin the upstream port to Caddy's :8080.
      - traefik.http.services.http-0-ijzwgnww9o9j1r0cyzacx99v-frontend.loadbalancer.server.port=8080

volumes:
  docs:
  cache_data:

networks:
  default:
  coolify:
    external: true
